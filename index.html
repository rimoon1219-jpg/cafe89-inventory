<script>

  const CURRENT_VERSION = "1790256144";

  // アプリを開くたび(タブを開いた時・バックグラウンドから復帰した時)に必ず
  // サーバー上の最新版と照合する。以前は一度「最新版だ」と確認したら、その
  // タブを開いている間は二度と確認しない作りだったため、GitHub Pagesへの
  // 反映が少し遅れたタイミングで開くと、そのまま古いバージョンを見続けて
  // しまう可能性があった。ETS TRACKと同じ考え方で、開くたびに毎回チェック
  // するようにしている(別ファイルのversion.jsonは使わず、index.html自身を
  // 取りに行って中のCURRENT_VERSIONと照合する方式のまま)。
  let __checkingVersion = false;
  async function checkVersion() {
    if (__checkingVersion) return;
    __checkingVersion = true;
    try {
      const res = await fetch("./index.html?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;
      const text = await res.text();
      const m = text.match(/CURRENT_VERSION = "([^"]+)"/);
      if (m && m[1] && m[1] !== CURRENT_VERSION) {
        window.location.reload(true);
      }
    } catch (e) {
    } finally {
      __checkingVersion = false;
    }
  }

  checkVersion();

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") checkVersion();
  });
  window.addEventListener("pageshow", () => {
    checkVersion();
  });
  window.addEventListener("focus", () => {
    checkVersion();
  });

</script>
