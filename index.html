<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>89 -eight nine- 在庫管理(試作版)</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F2; }
  * { box-sizing: border-box; }
  #sync-fab {
    position: fixed; right: 16px; bottom: 16px; z-index: 999;
    width: 48px; height: 48px; border-radius: 50%;
    background: #2B2620; color: #FAF7F2; border: none;
    font-size: 20px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    -webkit-tap-highlight-color: rgba(0,0,0,0.2);
  }
  #sync-status {
    position: fixed; right: 72px; bottom: 30px; z-index: 999;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    font-size: 11px; color: #8C7A66; background: #FFF;
    padding: 4px 8px; border-radius: 8px; border: 1px solid #EDE7DC;
    max-width: 200px;
  }
  #sync-modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(43,38,32,0.5);
    align-items: flex-end; justify-content: center;
  }
  #sync-modal-sheet {
    width: 100%; max-width: 480px; background: #FAF7F2;
    border-radius: 18px 18px 0 0; padding: 20px 20px 28px;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
  }
  #sync-modal-sheet h3 { margin: 0 0 8px; font-size: 16px; color: #2B2620; }
  #sync-modal-sheet p { margin: 0 0 14px; font-size: 12.5px; color: #8C7A66; line-height: 1.6; }
  #sync-modal-input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #C9BEA9;
    font-size: 14px; margin-bottom: 14px; font-family: monospace;
  }
  .sync-modal-buttons { display: flex; gap: 8px; }
  .sync-modal-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #sync-modal-save { background: #4A7C59; color: #FFF; }
  #sync-modal-clear { background: #FFF; color: #6B5D4F; border: 1px solid #C9BEA9; }
  #sync-modal-cancel { background: #FFF; color: #6B5D4F; border: 1px solid #C9BEA9; }
</style>
</head>
<body>
<div id="root"></div>
<button id="sync-fab" title="同期設定">⚙</button>
<div id="sync-status"></div>

<div id="sync-modal-overlay">
  <div id="sync-modal-sheet">
    <h3>同期設定</h3>
    <p>Google Apps ScriptのウェブアプリURLを貼り付けてください。スタッフ間で同期したい場合に設定します。空にすると「この端末のみの保存」に戻ります。</p>
    <input id="sync-modal-input" type="text" placeholder="https://script.google.com/macros/s/.../exec" />
    <div class="sync-modal-buttons">
      <button id="sync-modal-clear" class="sync-modal-btn">クリア</button>
      <button id="sync-modal-cancel" class="sync-modal-btn">キャンセル</button>
      <button id="sync-modal-save" class="sync-modal-btn">保存</button>
    </div>
  </div>
</div>

<script>

  const SYNC_URL_KEY = "cafe89-sync-url";
  function getSyncUrl() { return window.localStorage.getItem(SYNC_URL_KEY) || ""; }
  function setSyncUrl(url) { window.localStorage.setItem(SYNC_URL_KEY, url || ""); }

  function refreshSyncStatus() {
    const el = document.getElementById("sync-status");
    const url = getSyncUrl();
    el.textContent = url ? "同期設定: 有効" : "同期設定: 未設定(この端末のみ)";
  }

  function openSyncModal() {
    document.getElementById("sync-modal-overlay").style.display = "flex";
    const input = document.getElementById("sync-modal-input");
    input.value = getSyncUrl();
    input.focus();
  }
  function closeSyncModal() {
    document.getElementById("sync-modal-overlay").style.display = "none";
  }

  document.getElementById("sync-fab").addEventListener("click", openSyncModal);
  document.getElementById("sync-modal-cancel").addEventListener("click", closeSyncModal);
  document.getElementById("sync-modal-overlay").addEventListener("click", (e) => {
    if (e.target.id === "sync-modal-overlay") closeSyncModal();
  });
  document.getElementById("sync-modal-save").addEventListener("click", () => {
    const val = document.getElementById("sync-modal-input").value.trim();
    setSyncUrl(val);
    refreshSyncStatus();
    closeSyncModal();
    window.location.reload();
  });
  document.getElementById("sync-modal-clear").addEventListener("click", () => {
    document.getElementById("sync-modal-input").value = "";
  });

  refreshSyncStatus();

</script>
